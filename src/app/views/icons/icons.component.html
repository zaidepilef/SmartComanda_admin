<div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h5 class="mb-6 border-b border-gray-200 pb-3 text-base font-semibold text-gray-900 dark:border-slate-800 dark:text-white">
    SmartComanda Icons
  </h5>
  <div class="grid grid-cols-3 gap-4 sm:grid-cols-4 md:grid-cols-6">
    @for (icon of icons; track icon) {
      <div class="mb-4 text-center">
        <app-icon [name]="icon" class="mx-auto mb-2 block h-8 w-8 text-gray-700 dark:text-slate-300" />
        <div class="truncate text-xs text-gray-500 dark:text-slate-400">{{ icon }}</div>
      </div>
    }
  </div>
</div>
